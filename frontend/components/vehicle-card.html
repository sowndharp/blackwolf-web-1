<article class="vehicle-card"><img src="{{image}}" alt="{{model}}">
    <div class="vehicle-card-body">
        <p class="eyebrow">{{series}} / {{year}}</p>
        <h3>{{model}}</h3>
        <p>{{description}}</p>
        <div class="vehicle-meta"><span class="price">{{price}}</span><a class="text-link"
                href="/vehicle-details.html?id={{id}}">View details</a></div>
    </div>
</article>
