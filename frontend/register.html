<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Blackwolf Motors</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body class="auth-page">
    <main class="auth-layout"><a class="auth-brand brand" href="/">BLACKWOLF <span>MOTORS</span></a>
        <div class="auth-aside">
            <p class="eyebrow">THE BLACKWOLF EXPERIENCE</p>
            <h1>Your next<br><em>chapter.</em></h1>
            <p>Save your preferences and stay close to the collection.</p>
        </div>
        <section class="auth-card"><a class="back-link" href="/">← Back to showroom</a>
            <p class="eyebrow">CLIENT ACCESS</p>
            <h2>Create your account.</h2>
            <p class="muted">Begin your Blackwolf Motors journey.</p>
            <form id="registerForm"><label for="name">Full name</label><input id="name" type="text"
                    placeholder="Your name" autocomplete="name" required><label for="email">Email address</label><input
                    id="email" type="email" placeholder="you@example.com" autocomplete="email" required><label
                    for="password">Password</label>
                <div class="password-field"><input id="password" type="password" placeholder="Minimum 6 characters"
                        autocomplete="new-password" minlength="6" required><button id="registerPasswordToggle"
                        class="password-toggle" type="button" aria-label="Show password"
                        aria-pressed="false">Show</button></div><button class="btn btn-primary full"
                    type="submit">Create account <span aria-hidden="true">→</span></button>
                <div id="message" class="message" aria-live="polite"></div>
            </form>
            <p class="switch">Already a client? <a href="/login.html">Sign in</a></p>
        </section>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/register.js"></script>
</body>

</html>
